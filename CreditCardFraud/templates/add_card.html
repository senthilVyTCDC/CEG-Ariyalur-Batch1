<h2>Add Card</h2>

<form method="POST">
    User ID: <input type="number" name="user_id" required><br><br>
    Card Number: <input type="text" name="card_number" required><br><br>
    Card Type: <input type="text" name="card_type" required><br><br>
    Expiry Date: <input type="date" name="expiry_date" required><br><br>
    <input type="submit" value="Add Card">
</form>
