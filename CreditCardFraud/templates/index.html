<!DOCTYPE html>
<html>

<head>

<title>Credit Card Fraud Detection System</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background: linear-gradient(135deg,#eef2f7,#d9e4f5);
font-family:'Segoe UI', sans-serif;
min-height:100vh;
}



.title{
text-align:center;
margin-top:70px;
margin-bottom:40px;
}



.nav-card{
background:white;
border-radius:15px;
padding:30px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
transition:0.3s;
}

.nav-card:hover{
transform:translateY(-5px);
}


.btn{
border-radius:25px;
padding:10px 25px;
font-weight:500;
}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>💳 Credit Card Fraud Detection System</h1>

<p class="text-muted">
Select a module to manage database tables
</p>

</div>

<div class="row g-4 justify-content-center">



<div class="col-md-3">

<div class="nav-card">

<h4>Users</h4>

<p class="text-muted">Manage system users</p>

<a href="{{ url_for('user') }}" class="btn btn-primary">
Open Users
</a>

</div>

</div>



<div class="col-md-3">

<div class="nav-card">

<h4>Cards</h4>

<p class="text-muted">Manage credit cards</p>

<a href="{{ url_for('Display_Card') }}" class="btn btn-success">
Open Cards
</a>

</div>

</div>




<div class="col-md-3">

<div class="nav-card">

<h4>Transactions</h4>

<p class="text-muted">Manage transactions</p>

<a href="{{ url_for('transaction') }}" class="btn btn-warning">
Open Transactions
</a>

</div>

</div>




<div class="col-md-3">

<div class="nav-card">

<h4>Merchants</h4>

<p class="text-muted">Manage merchant data</p>

<a href="{{ url_for('merchant') }}" class="btn btn-danger">
Open Merchants
</a>

</div>

</div>

</div>

</div>

</body>

</html>
