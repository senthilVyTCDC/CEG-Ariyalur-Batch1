<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .form-card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            margin-top: 60px;
        }
        h2 {
            font-weight: 600;
            color: #212529;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px;
            transition: all 0.2s ease-in-out;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 6px rgba(13, 110, 253, 0.3);
        }
        .btn {
            border-radius: 25px;
            padding: 10px 22px;
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="form-card">
                <h2 class="text-center">➕ Add Transaction</h2>

                <form action="{{ url_for('transaction_add') }}" method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">User ID</label>
                            <input type="text" name="user_id" class="form-control" placeholder="Enter User ID" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Card ID</label>
                            <input type="text" name="card_id" class="form-control" placeholder="Enter Card ID" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Merchant ID</label>
                            <input type="text" name="merchant_id" class="form-control" placeholder="Enter Merchant ID" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Amount</label>
                            <input type="text" name="amount" class="form-control" placeholder="Enter Amount" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Transaction Status</label>
                        <select name="status" class="form-control" required>
                            <option value="">Select Status</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success me-2">Save Transaction</button>
                        <a href="{{ url_for('transaction') }}" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
