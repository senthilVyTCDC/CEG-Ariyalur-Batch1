<!DOCTYPE html>
<html>
<head>
    <title>Update Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .form-card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            margin-top: 60px;
        }
        h2 {
            font-weight: 600;
            color: #212529;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px;
            transition: all 0.2s ease-in-out;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 6px rgba(13, 110, 253, 0.3);
        }
        .btn {
            border-radius: 25px;
            padding: 10px 22px;
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-primary {
            background-color: #0d6efd;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="form-card">
                <h2 class="text-center">✏️ Update Transaction</h2>

                <form method="POST" onsubmit="updateFormAction(this)">
                    <div class="mb-3">
                        <label class="form-label">Transaction ID</label>
                        <input type="number" name="transaction_id" class="form-control"
                               placeholder="Enter Transaction ID" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Amount</label>
                        <input type="text" name="amount" class="form-control"
                               placeholder="Enter New Amount" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Transaction Status</label>
                        <select name="status" class="form-control" required>
                            <option value="">Select Status</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary me-2">Update Transaction</button>
                        <a href="{{ url_for('transaction') }}" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function updateFormAction(form) {
    var id = form.transaction_id.value;
    form.action = "/transaction_update/" + id;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
