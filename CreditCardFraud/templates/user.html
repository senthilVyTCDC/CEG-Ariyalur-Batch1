<!DOCTYPE html>
<html>

<head>
<title>User Management</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#eef1f5;
font-family:Arial;
}

/* Header bar */

.header{
background:#343a40;
color:white;
padding:15px;
border-radius:8px;
margin-bottom:20px;
}

/* Table card */

.table-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* Buttons */

.btn{
border-radius:20px;
}

</style>

</head>

<body>

<div class="container mt-4">

<div class="header">

<h3>User Management</h3>

</div>

<div class="table-card">

<div class="mb-3">

<a href="{{ url_for('user_add') }}" class="btn btn-success">Add User</a>
<a href="{{ url_for('user_update') }}" class="btn btn-warning">Update User</a>
<a href="{{ url_for('user_delete') }}" class="btn btn-danger">Delete User</a>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>User ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
</tr>

</thead>

<tbody>

{% for row in users %}

<tr>

<td>{{row.user_id}}</td>
<td>{{row.name}}</td>
<td>{{row.email}}</td>
<td>{{row.phone}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
