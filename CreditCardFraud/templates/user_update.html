<!DOCTYPE html>
<html>

<head>

<title>Update User</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#eef3ff;
}

.update-card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="update-card">

<h3 class="text-center mb-4">Update User</h3>

<form method="POST" onsubmit="updateFormAction(this)">

<input type="number" name="user_id"
class="form-control mb-3"
placeholder="User ID" required>

<input type="text" name="name"
class="form-control mb-3"
placeholder="New Name" required>

<input type="email" name="email"
class="form-control mb-3"
placeholder="New Email" required>

<input type="text" name="phone"
class="form-control mb-3"
placeholder="New Phone" required>

<div class="text-center">

<button class="btn btn-primary">Update</button>

<a href="{{ url_for('user') }}"
class="btn btn-secondary">Back</a>

</div>

</form>

</div>

</div>

</div>

</div>

<script>

function updateFormAction(form)
{
var id=form.user_id.value
form.action="/user_update/"+id
}

</script>

</body>
</html>
